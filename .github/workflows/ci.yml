name: research-kernel-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[analysis,dev]'
      - run: ruff check src tests scripts
      - run: mypy src
      - run: pytest
      - run: traceguard doctor --config configs/smoke.yaml
      - run: traceguard smoke --config configs/smoke.yaml --out /tmp/traceguard-smoke
      - run: traceguard verify --run-dir /tmp/traceguard-smoke/traceguard_smoke
      - run: python -m build
