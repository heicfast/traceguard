# its artifact; the frozen matrix then pins those values. This file is NOT a
# runnable experiment config — probe-model only.
experiment_name: traceguard_probe_qwen3_14b_monitor
experiment_stage: pilot
seed: 20261020
agent:
  # Structurally required; NOT probed in this file (role=monitor probes use
  # the monitor section only). Anchor values for reference.
  model_id: Qwen/Qwen3-4B
  model_revision: PIN_BEFORE_RUN
  tokenizer_revision: PIN_BEFORE_RUN
  reasoning_mode: true
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  max_generated_tokens_per_turn: 2048
  max_agent_turns: 10
  max_invalid_tool_calls: 3
  max_context_messages: 40
  provider: qwen_hf
  reasoning_protocol: qwen3
  quantization: none
  compute_dtype: float16
  attention_backend: sdpa
  max_context_tokens: 8192
  max_memory_per_gpu_gib: 14.0
sandbox:
