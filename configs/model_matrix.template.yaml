      revision: PIN_GEMMA4_12B_COMMIT
      tokenizer_revision: PIN_GEMMA4_12B_COMMIT
      provider: generic_hf
      reasoning_protocol: none
      quantization: bnb_nf4
      compute_dtype: float16
      attention_backend: sdpa
      max_context_tokens: 8192
      probe_artifact_sha256: PIN_GEMMA4_MONITOR_PROBE_SHA256
