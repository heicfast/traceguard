      api_model_id: qwen3-14b
      hardware_tier: aws_a100_80gb
      probe_artifact_sha256: null
    monitor:
      model_id: api/openai/gpt-6.1-sol
      revision: api-served-id-pin   # pinned by the API admission probe (models list)
      tokenizer_revision: api-served-id-pin
